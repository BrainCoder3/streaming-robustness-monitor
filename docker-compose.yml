# Single-node Kafka (KRaft mode, no ZooKeeper) and the three pipeline stages.
#   docker compose up --build
# Watch the alerts with:  docker compose logs -f monitor

x-app: &app
  build: .
  environment:
    KAFKA_BOOTSTRAP: kafka:9092
  depends_on:
    kafka:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: robustmon-kafka
    ports:
      - "9094:9094"   # host access (integration test): KAFKA_BOOTSTRAP=localhost:9094
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  inference:
    <<: *app
    command: ["python", "-m", "robustmon", "infer"]

  monitor:
    <<: *app
    command: ["python", "-m", "robustmon", "monitor"]

  producer:
    <<: *app
    command: ["python", "-m", "robustmon", "produce"]
    depends_on:
      kafka:
        condition: service_healthy
      inference:
        condition: service_started
      monitor:
        condition: service_started
